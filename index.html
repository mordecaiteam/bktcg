<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/webp"
      href="/bktcg-logo.webp"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="BKTCG Show brings Brooklyn's trading card community together for buying, selling, trading, and collecting."
    />

    <meta
      name="theme-color"
      content="#2A1E68"
    />

    <title>
      BKTCG Show | Brooklyn Trading Card Show
    </title>

    <!-- Inline so the loading screen appears before the app styles download. -->
    <style>
      html, body { margin: 0; background: #2A1E68; }
      .site-loader { position: fixed; inset: 0; z-index: 100; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: #2A1E68; color: white; font-family: system-ui, sans-serif; }
      .site-loader-logo { width: 176px; height: 176px; object-fit: contain;
        animation: site-loader-spin 2.4s linear infinite; }
      .site-loader-text { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .12em; }
      @keyframes site-loader-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .site-loader-logo { animation: none; } }
    </style>
    <link rel="preload" as="image" href="/bktcg-logo.webp" />
  </head>

  <body>
    <!--
      Hidden Contact Form
      Used by Netlify to detect the React contact form
    -->
    <form
      name="contact"
      data-netlify="true"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="contact"
      />

      <input
        type="text"
        name="name"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="tel"
        name="phone"
      />

      <input
        type="text"
        name="subject"
      />

      <textarea name="message"></textarea>
    </form>

    <!--
      Hidden Sponsor Interest Form
      Used by Netlify to detect the React sponsor form
    -->
    <form
      name="sponsor-interest"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="sponsor-interest"
      />

      <input
        name="bot-field"
      />

      <input
        type="text"
        name="business"
      />

      <input
        type="text"
        name="contact-name"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="text"
        name="website"
      />

      <select name="sponsorship-interest">
        <option value="event">
          Event Sponsorship
        </option>

        <option value="product">
          Product / Prize Sponsorship
        </option>

        <option value="promotional">
          Promotional Partnership
        </option>

        <option value="custom">
          Custom Partnership
        </option>

        <option value="unsure">
          Not Sure Yet
        </option>
      </select>

      <textarea name="message"></textarea>
    </form>

    <!-- React Application -->
    <div id="root">
      <div class="site-loader" role="status" aria-live="polite" aria-label="Loading site">
        <img class="site-loader-logo" src="/bktcg-logo.webp" alt="" width="176" height="176" fetchpriority="high" />
        <p class="site-loader-text">Loading...</p>
      </div>
    </div>
    <noscript><style>.site-loader { display: none; }</style><p style="color:white;text-align:center">Please enable JavaScript to view BKTCG Show.</p></noscript>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
